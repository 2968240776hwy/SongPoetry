{% extends 'base.html' %}
{% block title %}{{ title }} - 宋词雅韵{% endblock %}
{% block content %}
<div class="container mt-5" style="max-width: 700px;">
    <h3 class="mb-4">{{ title }}</h3>
    <form method="post" class="shadow-sm p-4 bg-white rounded">
        {% csrf_token %}
{#        <div class="mb-3">#}
{#            <label class="form-label">ID</label>#}
{#            <input type="text" name="value" class="form-control" value="{{ poem.value|default:'' }}" required>#}
{#        </div>#}
        <div class="mb-3">
            <label class="form-label">词牌名</label>
            <input type="text" name="rhythmic" class="form-control" value="{{ poem.rhythmic|default:'' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">作者</label>
            <input type="text" name="author" class="form-control" value="{{ poem.author|default:'' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">内容</label>
            <textarea name="content" rows="6" class="form-control" required>{{ poem.content|default:'' }}</textarea>
        </div>

        <div class="d-flex justify-content-between">
            <a href="{% url 'manager:poem_list' %}" class="btn btn-outline-secondary">返回</a>
            <button type="submit" class="btn btn-success">保存</button>
        </div>
    </form>
</div>
{% endblock %}
